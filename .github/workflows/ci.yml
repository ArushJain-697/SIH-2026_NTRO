name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    - name: gofmt
      run: test -z "$(gofmt -l .)"
    - name: vet
      run: go vet ./...
    - name: test
      run: go test -race -count=1 ./...
    - name: secret scan
      run: |
        ! grep -rn 'PRIVATE KEY\|password\s*=' --include='*.go' . || (echo "Possible secret in source" && exit 1)
